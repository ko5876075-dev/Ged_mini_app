<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GED Prep Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; padding: 16px; margin: 0; }
    h2 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
    .card { background: #2a2a2a; padding: 20px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; border: 1px solid #333; }
    .card:active { background: #3a3a3a; transform: scale(0.98); }
    .question-box { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; }
    .option-btn { display: block; width: 100%; margin: 8px 0; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; text-align: left; font-size: 15px; cursor: pointer; }
    .option-btn:active { background: #444; }
    #status { font-size: 14px; margin-top: 12px; padding: 10px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; }
  </style>
</head>
<body>
  <h2>GED Subjects</h2>
  <div class="grid">
    <div class="card" onclick="loadSubject('Math')">Math</div>
    <div class="card" onclick="loadSubject('Science')">Science</div>
  </div>
  
  <div id="status" style="color: #0088cc;">Connecting to questions.json...</div>
  <div id="quiz-container" class="question-box" style="display:none;"></div>

  <script>
    let questionsData = [];
    const letters = ["A", "B", "C", "D"];

    // Force network fetch by appending timestamp parameter
    fetch('./questions.json?nc=' + new Date().getTime())
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status + " (File not found)");
        return res.json();
      })
      .then(data => { 
        questionsData = data; 
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "#4CAF50";
        statusDiv.innerText = "✓ Questions loaded successfully (" + data.length + " total). Tap Math above!";
      })
      .catch(err => {
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = "#F44336";
        statusDiv.innerText = "Fetch Error: " + err.message;
      });

    function loadSubject(subject) {
      const container = document.getElementById('quiz-container');
      
      if (!questionsData || questionsData.length === 0) {
        alert("Cannot load options yet. Status: " + document.getElementById('status').innerText);
        return;
      }

      const filtered = questionsData.filter(q => q.subject && q.subject.toLowerCase() === subject.toLowerCase());
      
      if (!filtered.length) {
        container.style.display = 'block';
        container.innerHTML = <p style="color:#ffcc00;">No questions found under subject "${subject}".</p>;
        return;
      }
      
      // Render first question from subject
      const q = filtered[0];
      container.style.display = 'block';
      container.innerHTML = `
        <small style="color:#aaa">${q.topic  ''} • ${q.difficulty  ''}</small>
        <h3 style="margin: 10px 0;">${q.question}</h3>
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="checkAnswer('${letters[i]}', '${q.answer}', \`${q.explanation || ''}\`)">
            <strong>${letters[i]}.</strong> ${opt}
          </button>
        `).join('')}
        <div id="result" style="margin-top: 15px;"></div>
      `;
    }

    function checkAnswer(selectedLetter, correctLetter, explanation) {
      const resultDiv = document.getElementById('result');
      if (selectedLetter === correctLetter) {
        resultDiv.innerHTML = <p style="color:#4CAF50; background:#1b381e; padding:10px; border-radius:6px; margin:0;"><strong>Correct!</strong> ${explanation}</p>;
      } else {
        resultDiv.
      innerHTML = <p style="color:#F44336; background:#3b1c1c; padding:10px; border-radius:6px; margin:0;"><strong>Incorrect.</strong> ${explanation}</p>;
      }
    }
  </script>
</body>
</html>
