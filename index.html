<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GED Prep Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 16px; margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
    .card { background: #1e1e1e; padding: 16px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; }
    .question-box { background: #2a2a2a; padding: 16px; border-radius: 8px; margin-top: 20px; }
    .option-btn { display: block; width: 100%; margin: 8px 0; padding: 10px; background: #333; color: #fff; border: none; border-radius: 6px; text-align: left; }
  </style>
</head>
<body>
  <h2>GED Subjects</h2>
  <div class="grid">
    <div class="card" onclick="loadSubject('Math')">Math</div>
    <div class="card" onclick="loadSubject('Science')">Science</div>
  </div>
  <div id="quiz-container" class="question-box" style="display:none;"></div>

  <script>
    let questionsData = [];
    const letters = ["A", "B", "C", "D"];

    // Fetch the renamed file
    fetch('questions.json')
      .then(res => res.json())
      .then(data => { questionsData = data; });

    function loadSubject(subject) {
      const container = document.getElementById('quiz-container');
      const filtered = questionsData.filter(q => q.subject === subject);
      
      if (!filtered.length) {
        container.style.display = 'block';
        container.innerHTML = '<p>No questions found for this subject.</p>';
        return;
      }
      
      const q = filtered[0];
      container.style.display = 'block';
      container.innerHTML = `
        <small>${q.topic} • ${q.difficulty}</small>
        <h3>${q.question}</h3>
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="checkAnswer('${letters[i]}', '${q.answer}', '${q.explanation}')">
            ${letters[i]}. ${opt}
          </button>
        `).join('')}
        <div id="result"></div>
      `;
    }

    function checkAnswer(selectedLetter, correctLetter, explanation) {
      const resultDiv = document.getElementById('result');
      if (selectedLetter === correctLetter) {
        resultDiv.innerHTML = <p style="color:#4CAF50;"><strong>Correct!</strong> ${explanation}</p>;
      } else {
        resultDiv.innerHTML = <p style="color:#F44336;"><strong>Incorrect.</strong> ${explanation}</p>;
      }
    }
  </script>
</body>
</html>
